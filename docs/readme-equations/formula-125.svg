<title id="title">Equation 10.7-4</title>
<desc id="desc">LaTeX source: {\widehat{\boldsymbol{\Phi}}}_{m}
= \sum_{i = 1}^{N}\Delta\boldsymbol{\theta}_{m}(i)
+ \left[\sum_{i = 1}^{N - 1} k_{i}\Delta\boldsymbol{\theta}_{m}(i)\right] \times \Delta\boldsymbol{\theta}_{m}(N)\qquad(10.7-4)</desc>
