<title id="title">Equation 10.3-4</title>
<desc id="desc">LaTeX source: \delta\dot{\lambda} = \frac{\sec L}{R_{Nh}}\delta v_{E}^{n} + \frac{v_{E}^{n}\sec L\tan L}{R_{Nh}}\delta L - \frac{v_{E}^{n}\sec L}{R_{Nh}^{2}}\delta h\qquad(10.3-4)</desc>
