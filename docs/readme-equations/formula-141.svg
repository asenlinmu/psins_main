<title id="title">PSINS formula 141</title>
<desc id="desc">LaTeX source: \left\{ \begin{aligned}
 &amp; \boldsymbol{\Phi}_{m} = \boldsymbol{\Delta}\boldsymbol{\theta}_{m} + 1/12(\boldsymbol{\Delta}\boldsymbol{\theta}_{m - 1} \times \boldsymbol{\Delta}\boldsymbol{\theta}_{m}) \\
 &amp; \boldsymbol{\Delta}\mathbf{v}_{sf,m}^{b_{m - 1}} = \boldsymbol{\Delta}\mathbf{v}_{m} + 1/2(\boldsymbol{\Delta}\boldsymbol{\theta}_{m} \times \boldsymbol{\Delta}\mathbf{v}_{m})
\end{aligned} \right.</desc>
