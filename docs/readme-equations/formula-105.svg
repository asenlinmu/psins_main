<title id="title">Equation 10.6-1</title>
<desc id="desc">LaTeX source: \mathbf{v}_{OD}^{b} = \mathbf{C}_{o}^{b}\begin{bmatrix}
0 \\
v_{OD} \\
0
\end{bmatrix} = \begin{bmatrix}
\sin\alpha_{\psi}\cos\alpha_{\theta} \\
\cos\alpha_{\psi}\cos\alpha_{\theta} \\
\sin\alpha_{\theta}
\end{bmatrix}v_{OD}\qquad(10.6-1)</desc>
