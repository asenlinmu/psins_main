<title id="title">PSINS formula 136</title>
<desc id="desc">LaTeX source: \mathbf{C}_{t}^{n} = \begin{bmatrix}
\cos\psi &amp; - \cos\theta\sin\psi &amp; \sin\theta\sin\psi \\
\sin\psi &amp; \cos\theta\cos\psi &amp; - \sin\theta\cos\psi \\
0 &amp; \sin\theta &amp; \cos\theta
\end{bmatrix}</desc>
