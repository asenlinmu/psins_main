<title id="title">PSINS formula 139</title>
<desc id="desc">LaTeX source: \mathbf{C}_{A}^{\omega} = \begin{bmatrix}
\cos\gamma &amp; 0 &amp; - \sin\gamma\cos\theta \\
0 &amp; 1 &amp; \sin\theta \\
\sin\gamma &amp; 0 &amp; \cos\gamma\cos\theta
\end{bmatrix}</desc>
